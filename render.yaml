# Render Blueprint for this server.
# Dashboard: New > Blueprint > pick this repo. Render then asks for the
# values marked `sync: false`.
services:
  - type: web
    name: threedollarai-backend
    runtime: node
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: UPSTREAM_BASE_URL
        value: https://genrecai-freellmapi.onrender.com/v1
      - key: UPSTREAM_MODEL
        value: auto
      - key: PLAY_PACKAGE_NAME
        value: com.dotwellabs.threedollarai
      - key: PLAY_PRODUCT_IDS
        value: pro_monthly
      - key: PASS_SECRET
        generateValue: true
      - key: UPSTREAM_API_KEY
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
